<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif;
        }

        .sidebar {
            width: 220px;
            flex-shrink: 0;
        }

        .nav-link {
            transition: all 0.15s ease;
        }

        .nav-link.active {
            background: #EFF6FF;
            color: #1A56DB;
            border-left: 3px solid #1A56DB;
        }

        .nav-link:not(.active):hover {
            background: #F8FAFC;
            color: #1A56DB;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .toggle-btn {
            transition: background 0.2s;
        }

        .cam-card {
            transition: box-shadow 0.15s;
        }

        .cam-card:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>

                            <label class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">위치</label>
                            <input id="loc-cam4" value="2공장 격리 구역" type="text"
                                class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-blue-400"
                                onblur="saveCamera('cam4')">
                        </div>
                    </div>
                    <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between">
                        <span
                            class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200"
                            id="status-cam4">● 활성화</span>
                        <button onclick="saveCamera('cam4')"
                            class="text-[10px] font-bold text-blue-600 hover:text-blue-800">저장 →</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Camera settings are stored in localStorage for now (no backend entity)
        function toggleCamera(camId, enabled) {
            const statusEl = document.getElementById(`status-${camId}`);
            if (enabled) {
                statusEl.textContent = '● 활성화';
                statusEl.className = 'text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200';
            } else {
                statusEl.textContent = '○ 비활성화';
                statusEl.className = 'text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 border border-slate-200';
            }
            const settings = JSON.parse(localStorage.getItem('cameraSettings') || '{}');
            if (!settings[camId]) settings[camId] = {};
            settings[camId].enabled = enabled;
            localStorage.setItem('cameraSettings', JSON.stringify(settings));
        }

        function saveCamera(camId) {
            const name = document.getElementById(`name-${camId}`).value;
            const loc = document.getElementById(`loc-${camId}`).value;
            const settings = JSON.parse(localStorage.getItem('cameraSettings') || '{}');
            if (!settings[camId]) settings[camId] = {};
            settings[camId].name = name;
            settings[camId].location = loc;
            localStorage.setItem('cameraSettings', JSON.stringify(settings));
            // Visual feedback
            const btn = event && event.target;
            if (btn) { btn.textContent = '✓ 저장됨'; setTimeout(() => btn.textContent = '저장 →', 1500); }
        }

        // Load saved settings on page load
        window.addEventListener('load', () => {
            const settings = JSON.parse(localStorage.getItem('cameraSettings') || '{}');
            ['cam1', 'cam2', 'cam3', 'cam4'].forEach(camId => {
                if (settings[camId]) {
                    const s = settings[camId];
                    if (s.name) document.getElementById(`name-${camId}`).value = s.name;
                    if (s.location) document.getElementById(`loc-${camId}`).value = s.location;
                    if (s.enabled === false) {
                        document.getElementById(`toggle-${camId}`).checked = false;
                        toggleCamera(camId, false);
                    }
                }
            });
        });
    </script>
</body>

</html>
