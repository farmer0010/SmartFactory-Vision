<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>SmartFactory Vision — 감사 로그</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .sidebar {
            width: 220px;
            flex-shrink: 0;
        }

        .nav-link {
            transition: all 0.15s ease;
        }

        .nav-link.active {
            background: #EFF6FF;
            color: #1A56DB;
            border-left: 3px solid #1A56DB;
        }

        .nav-link:not(.active):hover {
            background: #F8FAFC;
            color: #1A56DB;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .log-row:hover td {
            background: #fafafa;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex">
    <aside class="sidebar bg-white border-r border-slate-200 flex flex-col h-screen shadow-sm">
        <div class="px-5 py-5 border-b border-slate-100">
            <a href="/" class="flex items-center space-x-2.5 no-underline">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </div>
                <div>
                    <div class="text-sm font-bold text-slate-800">SmartFactory</div>
                    <div class="text-[10px] font-semibold text-blue-600 uppercase tracking-wider">Vision</div>
                </div>
            </a>
        </div>
        <nav class="flex-1 py-4 px-3 space-y-0.5 overflow-y-auto">
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest px-3 pb-1.5 pt-1">모니터링</p>
            <a href="/"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600"><svg
                    class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg><span>실시간 대시보드</span></a>
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest px-3 pb-1.5 pt-3">기록 / 분석</p>
            <a href="/history"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600"><svg
                    class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg><span>검출 이력</span></a>
            <a href="/history/analytics"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600"><svg
                    class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg><span>통계 분석</span></a>
            <a href="/history/reports"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600"><svg
                    class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg><span>리포트</span></a>
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest px-3 pb-1.5 pt-3">시스템 관리</p>
            <a href="/admin"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600"><svg
                    class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg><span>개요</span></a>
            <a href="/admin/users"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600 pl-8"><span>사용자
                    관리</span></a>
            <a href="/admin/cameras"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600 pl-8"><span>카메라
                    설정</span></a>
            <a href="/admin/settings"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600 pl-8"><span>시스템
                    설정</span></a>
            <a href="/admin/audit"
                class="nav-link active flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-blue-700 pl-8"><span>감사
                    로그</span></a>
        </nav>
        <div class="px-4 py-4 border-t border-slate-100">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                    <span class="text-blue-700 font-bold text-xs">A</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-semibold text-slate-700"
                        th:text="${displayName != null ? displayName : '관리자'}">관리자</p>
                    <p class="text-[10px] text-slate-400">ADMIN</p>
                </div>
                <a href="/logout" onclick="return confirm('로그아웃?')"
                    class="p-1.5 text-slate-400 hover:text-red-500 rounded-md transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </a>
            </div>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-screen min-w-0 overflow-hidden">
        <header
            class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between flex-shrink-0 shadow-sm">
            <div>
                <h1 class="text-sm font-bold text-slate-800">감사 로그</h1>
                <p class="text-[11px] text-slate-400 mt-0.5">관리자 작업 이력 · 로그인 · DB 초기화 · PLC 명령</p>
            </div>
            <button onclick="clearAuditLog()"
                class="px-3 py-1.5 text-[11px] font-semibold text-red-600 border border-red-200 hover:bg-red-50 rounded-lg transition-colors">로그
                초기화</button>
        </header>

        <main class="flex-1 overflow-hidden p-4 min-h-0">
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm h-full flex flex-col overflow-hidden">
                <div class="flex-1 overflow-y-auto min-h-0">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                            <tr>
                                <th
                                    class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-40">
                                    시각</th>
                                <th
                                    class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-28">
                                    사용자</th>
                                <th
                                    class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-28">
                                    유형</th>
                                <th class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider">내용
                                </th>
                            </tr>
                        </thead>
                        <tbody id="auditTableBody" class="divide-y divide-slate-100">
                        </tbody>
                    </table>
                </div>
                <div
                    class="border-t border-slate-100 px-4 py-3 flex items-center justify-between flex-shrink-0 bg-slate-50">
                    <span class="text-[11px] text-slate-400">총 <span id="auditCount"
                            class="font-bold text-slate-600">0</span>건의 감사 이벤트</span>
                    <p class="text-[10px] text-slate-400">감사 로그는 브라우저 세션 내 로컬에 저장됩니다.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Audit log is stored in sessionStorage for client-side demo
        // In production, these would be server-side events logged by AuditService

        function loadAuditLog() {
            const logs = JSON.parse(sessionStorage.getItem('auditLog') || '[]');
            // Add current session login event if not already there
            if (logs.length === 0) {
                addAuditEntry('SYSTEM', 'LOGIN', '관리자 로그인');
                addAuditEntry('SYSTEM', 'SYSTEM', '관리자 패널 접근');
                return;
            }
            renderAuditTable(logs);
        }

        function renderAuditTable(logs) {
            document.getElementById('auditCount').textContent = logs.length;
            const tbody = document.getElementById('auditTableBody');
            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-4 py-8 text-center text-slate-400 text-xs">기록된 감사 이벤트가 없습니다.</td></tr>';
                return;
            }
            tbody.innerHTML = [...logs].reverse().map(l => {
                const typeBadge = {
                    'LOGIN': 'bg-blue-50 text-blue-700 border-blue-200',
                    'LOGOUT': 'bg-slate-100 text-slate-600 border-slate-200',
                    'DB_RESET': 'bg-red-50 text-red-700 border-red-200',
                    'PLC': 'bg-orange-50 text-orange-700 border-orange-200',
                    'SYSTEM': 'bg-purple-50 text-purple-700 border-purple-200',
                    'USER_MGMT': 'bg-emerald-50 text-emerald-700 border-emerald-200',
                }[l.type] || 'bg-slate-100 text-slate-600 border-slate-200';
                return `<tr class="log-row">
                    <td class="px-4 py-3 text-[11px] font-mono text-slate-500">${l.time}</td>
                    <td class="px-4 py-3 text-xs font-semibold text-slate-700">${l.user}</td>
                    <td class="px-4 py-3"><span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${typeBadge}">${l.type}</span></td>
                    <td class="px-4 py-3 text-xs text-slate-600">${l.message}</td>
                </tr>`;
            }).join('');
        }

        function addAuditEntry(user, type, message) {
            const logs = JSON.parse(sessionStorage.getItem('auditLog') || '[]');
            logs.push({ time: new Date().toLocaleString('ko-KR'), user, type, message });
            sessionStorage.setItem('auditLog', JSON.stringify(logs));
            renderAuditTable(logs);
        }

        function clearAuditLog() {
            if (!confirm('모든 감사 로그를 초기화하시겠습니까?')) return;
            sessionStorage.removeItem('auditLog');
            addAuditEntry('ADMIN', 'SYSTEM', '감사 로그 초기화됨');
        }

        // Intercept DB cleanup to add audit entry
        window.addEventListener('load', loadAuditLog);
    </script>
</body>

</html>
