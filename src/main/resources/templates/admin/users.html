<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFactory Vision — 사용자 관리</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif;
        }

        .sidebar {
            width: 220px;
            flex-shrink: 0;
        }

        .nav-link {
            transition: all 0.15s ease;
        }

        .nav-link.active {
            background: #EFF6FF;
            color: #1A56DB;
            border-left: 3px solid #1A56DB;
        }

        .nav-link:not(.active):hover {
            background: #F8FAFC;
            color: #1A56DB;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .table-row:hover td {
            background: #F8FAFC;
        }

        /* Modal */
        .modal-overlay {
            backdrop-filter: blur(4px);
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex">

    
    <aside class="sidebar bg-white border-r border-slate-200 flex flex-col h-screen overflow-hidden shadow-sm">
        <div class="px-5 py-5 border-b border-slate-100">
            <a href="/" class="flex items-center space-x-2.5 no-underline">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center flex-shrink-0 shadow">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </div>
                <div>
                    <div class="text-sm font-bold text-slate-800 leading-tight">SmartFactory</div>
                    <div class="text-[10px] font-semibold text-blue-600 uppercase tracking-wider leading-tight">Vision
                    </div>
                </div>
            </a>
        </div>
        <nav class="flex-1 py-4 px-3 space-y-0.5 overflow-y-auto">
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest px-3 pb-1.5 pt-1">모니터링</p>
            <a href="/"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600"><svg
                    class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg><span>실시간 대시보드</span></a>
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest px-3 pb-1.5 pt-3">기록 / 분석</p>
            <a href="/history"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600"><svg
                    class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg><span>검출 이력</span></a>
            <a href="/history/analytics"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600"><svg
                    class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg><span>통계 분석</span></a>
            <a href="/history/reports"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600"><svg
                    class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg><span>리포트</span></a>
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest px-3 pb-1.5 pt-3">시스템 관리</p>
            <a href="/admin"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600"><svg
                    class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg><span>개요</span></a>
            <a href="/admin/users"
                class="nav-link active flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-blue-700 pl-8"><svg
                    class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg><span>사용자 관리</span></a>
            <a href="/admin/cameras"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600 pl-8"><svg
                    class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15 10l4.553-2.069A1 1 0 0121 8.867v6.266a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg><span>카메라 설정</span></a>
            <a href="/admin/settings"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600 pl-8"><svg
                    class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg><span>시스템 설정</span></a>
            <a href="/admin/audit"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600 pl-8"><svg
                    class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg><span>감사 로그</span></a>
        </nav>
        <div class="px-4 py-4 border-t border-slate-100 flex-shrink-0">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
                    <span class="text-blue-700 font-bold text-xs"
                        th:text="${displayName != null ? displayName.substring(0,1) : 'A'}">A</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-semibold text-slate-700 truncate"
                        th:text="${displayName != null ? displayName : '관리자'}">관리자</p>
                    <p class="text-[10px] text-slate-400 font-medium">ADMIN</p>
                </div>
                <a href="/logout" onclick="return confirm('로그아웃 하시겠습니까?')"
                    class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-md transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </a>
            </div>
        </div>
    </aside>

    
    <div class="flex-1 flex flex-col h-screen min-w-0 overflow-hidden">
        <header
            class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between flex-shrink-0 shadow-sm">
            <div>
                <h1 class="text-sm font-bold text-slate-800">사용자 관리</h1>
                <p class="text-[11px] text-slate-400 mt-0.5">계정 생성 · 역할 변경 · 비밀번호 초기화 · 삭제</p>
            </div>
            <button onclick="openCreateModal()"
                class="px-4 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition-colors">
                + 새 사용자 추가
            </button>
        </header>

        
        <main class="flex-1 overflow-hidden p-4 min-h-0">
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm h-full flex flex-col overflow-hidden">
                
                <div id="statusMsg" class="hidden px-4 py-2.5 text-xs font-semibold border-b"></div>

                <div class="flex-1 overflow-y-auto min-h-0">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                            <tr>
                                <th
                                    class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-16">
                                    ID</th>
                                <th class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider">사용자
                                    ID</th>
                                <th class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider">표시
                                    이름</th>
                                <th class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider">역할
                                </th>
                                <th class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider">상태
                                </th>
                                <th
                                    class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-56">
                                    액션</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody" class="divide-y divide-slate-100">
                            <tr>
                                <td colspan="6" class="px-4 py-8 text-center text-slate-400 text-xs">로딩 중...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    
    <div id="createModal"
        class="hidden fixed inset-0 bg-black/30 modal-overlay z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
            <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
                <h2 class="text-sm font-bold text-slate-800">새 사용자 추가</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="px-6 py-5 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">사용자 ID (로그인 ID) *</label>
                    <input id="newUsername" type="text" placeholder="예: worker2"
                        class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">표시 이름</label>
                    <input id="newDisplayName" type="text" placeholder="예: 홍길동"
                        class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">초기 비밀번호 *</label>
                    <input id="newPassword" type="password" placeholder="8자 이상 권장"
                        class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">역할</label>
                    <select id="newRole"
                        class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:border-blue-400">
                        <option value="WORKER">WORKER (일반 작업자)</option>
                        <option value="ADMIN">ADMIN (관리자)</option>
                    </select>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-100 flex justify-end space-x-2">
                <button onclick="closeModal()"
                    class="px-4 py-2 text-xs font-semibold text-slate-600 border border-slate-200 hover:bg-slate-50 rounded-lg">취소</button>
                <button onclick="createUser()"
                    class="px-4 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg">생성</button>
            </div>
        </div>
    </div>

    <script>
        async function loadUsers() {
            const res = await fetch('/api/admin/users');
            const users = await res.json();
            const tbody = document.getElementById('userTableBody');
            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400 text-xs">등록된 사용자가 없습니다.</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(u => {
                const roleBadge = u.role === 'ADMIN'
                    ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200">ADMIN</span>'
                    : '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200">WORKER</span>';
                const statusBadge = u.enabled
                    ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">활성</span>'
                    : '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-50 text-red-600 border border-red-200">비활성</span>';
                const newRole = u.role === 'ADMIN' ? 'WORKER' : 'ADMIN';
                return `<tr class="table-row">
                    <td class="px-4 py-3 text-[11px] font-mono text-slate-400">#${u.id}</td>
                    <td class="px-4 py-3 text-xs font-semibold text-slate-700">${u.username}</td>
                    <td class="px-4 py-3 text-xs text-slate-600">${u.displayName || '—'}</td>
                    <td class="px-4 py-3">${roleBadge}</td>
                    <td class="px-4 py-3">${statusBadge}</td>
                    <td class="px-4 py-3">
                        <div class="flex space-x-1.5 flex-wrap gap-y-1">
                            <button onclick="changeRole(${u.id}, '${newRole}')" class="text-[10px] font-semibold px-2 py-1 rounded border border-blue-200 text-blue-600 hover:bg-blue-50">→${newRole}</button>
                            <button onclick="resetPassword(${u.id})" class="text-[10px] font-semibold px-2 py-1 rounded border border-amber-200 text-amber-600 hover:bg-amber-50">PW초기화</button>
                            <button onclick="deleteUser(${u.id}, '${u.username}')" class="text-[10px] font-semibold px-2 py-1 rounded border border-red-200 text-red-600 hover:bg-red-50">삭제</button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        function showStatus(msg, isError = false) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = `px-4 py-2.5 text-xs font-semibold border-b ${isError ? 'bg-red-50 text-red-700 border-red-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        async function changeRole(id, role) {
            const res = await fetch(`/api/admin/users/${id}/role`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role }) });
            const data = await res.json();
            showStatus(data.message || data.error, !res.ok);
            loadUsers();
        }

        async function resetPassword(id) {
            if (!confirm('비밀번호를 "reset123"으로 초기화하시겠습니까?')) return;
            const res = await fetch(`/api/admin/users/${id}/reset-password`, { method: 'PUT' });
            const data = await res.json();
            showStatus(data.message || data.error, !res.ok);
        }

        async function deleteUser(id, username) {
            if (!confirm(`"${username}" 계정을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.`)) return;
            const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
            const data = await res.json();
            showStatus(data.message || data.error, !res.ok);
            loadUsers();
        }

        function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('createModal').classList.add('hidden'); }

        async function createUser() {
            const username = document.getElementById('newUsername').value.trim();
            const displayName = document.getElementById('newDisplayName').value.trim();
            const password = document.getElementById('newPassword').value;
            const role = document.getElementById('newRole').value;
            if (!username || !password) { alert('사용자 ID와 비밀번호는 필수입니다.'); return; }
            const res = await fetch('/api/admin/users', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, displayName, password, role })
            });
            const data = await res.json();
            showStatus(data.message || data.error, !res.ok);
            if (res.ok) { closeModal(); loadUsers(); }
        }

        window.addEventListener('load', loadUsers);
    </script>
</body>

</html>
