<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SmartFactory Vision Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
        }

        .neon-border {
            box-shadow: 0 0 10px #22d3ee, 0 0 20px #22d3ee inset;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 10px #22d3ee;
            animation: scan 2s linear infinite;
            z-index: 10;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: 0%;
                opacity: 0;
            }

            5% {
                opacity: 1;
            }

            95% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>

<body class="bg-slate-900 text-cyan-400 h-screen overflow-hidden flex flex-col">
    <header class="flex justify-between items-center p-4 border-b border-cyan-800 bg-slate-950 shadow-lg z-50">
        <div class="flex items-center space-x-3">
            <svg class="w-8 h-8 text-cyan-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
            </svg>
            <h1
                class="text-2xl font-bold tracking-widest uppercase text-cyan-300 drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]">
                SmartFactory<span class="text-white">Vision</span>
            </h1>
        </div>
        <nav class="flex space-x-4">
            <a href="/"
                class="px-3 py-1 bg-cyan-900/30 text-cyan-300 rounded border border-cyan-500/50 shadow-[0_0_10px_rgba(34,211,238,0.2)] text-xs font-bold uppercase tracking-wider">Dashboard</a>
            <a href="/history"
                class="px-3 py-1 bg-slate-800 hover:bg-cyan-900/50 text-slate-400 hover:text-cyan-300 rounded border border-transparent hover:border-cyan-500/50 transition-all text-xs font-bold uppercase tracking-wider">Analysis</a>
        </nav>
        <div class="flex items-center space-x-4">
            <div id="connectionStatus"
                class="flex items-center space-x-2 border border-slate-700 px-3 py-1 rounded-full bg-slate-900">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                <span class="text-xs font-bold uppercase tracking-wider text-red-500">Offline</span>
            </div>
            <div class="text-[10px] text-slate-500 tracking-widest">SYS.VER.1.0</div>
        </div>
    </header>
    <main class="flex-1 grid grid-cols-12 gap-4 p-4 min-h-0">
        <div class="col-span-8 grid grid-cols-2 grid-rows-2 gap-4 h-full min-h-0">
            <div
                class="relative bg-slate-800 rounded-lg border border-cyan-900 overflow-hidden shadow-[0_0_20px_rgba(0,0,0,0.5)] group">
                <div
                    class="absolute top-2 left-2 z-20 bg-black/70 px-2 py-0.5 rounded text-[10px] border border-cyan-500/30 text-cyan-200 tracking-wider">
                    CAM-01</div>
                <div class="scan-line opacity-50"></div>
                <div class="relative w-full h-full bg-black flex items-center justify-center">
                    <span id="camStatus-cam1" class="text-cyan-700 text-xs animate-pulse z-5">Initializing
                        Camera...</span>
                    <canvas id="overlayCanvas-cam1" class="absolute w-full h-full z-10 pointer-events-none"></canvas>
                </div>
            </div>
            <div
                class="relative bg-slate-800 rounded-lg border border-cyan-900 overflow-hidden shadow-[0_0_20px_rgba(0,0,0,0.5)] group">
                <div
                    class="absolute top-2 left-2 z-20 bg-black/70 px-2 py-0.5 rounded text-[10px] border border-cyan-500/30 text-cyan-200 tracking-wider">
                    CAM-02</div>
                <div class="scan-line opacity-30"></div>
                <div class="relative w-full h-full bg-black flex items-center justify-center">
                    <span id="camStatus-cam2" class="text-cyan-700 text-xs animate-pulse z-5">Initializing
                        Camera...</span>
                    <canvas id="overlayCanvas-cam2" class="absolute w-full h-full z-10 pointer-events-none"></canvas>
                </div>
            </div>
            <div
                class="relative bg-slate-800 rounded-lg border border-cyan-900 overflow-hidden shadow-[0_0_20px_rgba(0,0,0,0.5)] group">
                <div
                    class="absolute top-2 left-2 z-20 bg-black/70 px-2 py-0.5 rounded text-[10px] border border-cyan-500/30 text-cyan-200 tracking-wider">
                    CAM-03</div>
                <div class="scan-line opacity-30"></div>
                <div class="relative w-full h-full bg-black flex items-center justify-center">
                    <span id="camStatus-cam3" class="text-cyan-700 text-xs animate-pulse z-5">Standby</span>
                    <canvas id="overlayCanvas-cam3" class="absolute w-full h-full z-10 pointer-events-none"></canvas>
                </div>
            </div>
            <div
                class="relative bg-slate-800 rounded-lg border border-cyan-900 overflow-hidden shadow-[0_0_20px_rgba(0,0,0,0.5)] group">
                <div
                    class="absolute top-2 left-2 z-20 bg-black/70 px-2 py-0.5 rounded text-[10px] border border-cyan-500/30 text-cyan-200 tracking-wider">
                    CAM-04</div>
                <div class="scan-line opacity-30"></div>
                <div class="relative w-full h-full bg-black flex items-center justify-center">
                    <span id="camStatus-cam4" class="text-cyan-700 text-xs animate-pulse z-5">Standby</span>
                    <canvas id="overlayCanvas-cam4" class="absolute w-full h-full z-10 pointer-events-none"></canvas>
                </div>
            </div>
            <video id="webcamVideo" autoplay playsinline muted class="hidden"></video>
        </div>
        <div class="col-span-4 flex flex-col space-y-4 min-h-0">
            <!-- Robot Arm Container -->
            <div
                class="bg-slate-800 p-2 rounded-lg border border-cyan-900/50 shadow-[0_0_15px_rgba(0,0,0,0.5)] h-48 flex flex-col relative overflow-hidden group">
                <div class="absolute inset-0 bg-gradient-to-b from-transparent to-cyan-900/20 z-0"></div>
                <h3
                    class="text-[10px] font-bold uppercase text-slate-300 tracking-wider absolute top-2 left-2 z-10 bg-slate-900/50 px-2 py-0.5 rounded border border-slate-700">
                    Digital Twin Robot</h3>
                <div id="robot-container" class="w-full h-full absolute inset-0 z-0"></div>
                <div id="robotStatus"
                    class="absolute bottom-2 right-2 z-10 text-[9px] font-bold px-2 py-0.5 rounded bg-cyan-900/80 text-cyan-300 border border-cyan-500/50 uppercase tracking-widest">
                    IDLE</div>
            </div>

            <!-- Dashboard Stats -->
            <div class="grid grid-cols-2 gap-4 h-24 shrink-0">
                <div
                    class="bg-slate-800 p-3 rounded-lg border border-cyan-900/50 shadow-lg flex flex-col relative overflow-hidden">
                    <h3 class="text-[9px] text-slate-400 uppercase tracking-wider mb-1">FPS</h3>
                    <div class="flex items-baseline">
                        <span id="currentFps"
                            class="text-2xl font-bold text-cyan-300 drop-shadow-[0_0_5px_rgba(34,211,238,0.5)]">0</span>
                    </div>
                    <div class="absolute bottom-0 left-0 w-full h-1/2 opacity-30"><canvas id="fpsChart"></canvas></div>
                </div>
                <div
                    class="bg-slate-800 p-3 rounded-lg border border-cyan-900/50 shadow-lg flex flex-col justify-center relative overflow-hidden">
                    <h3 class="text-[9px] text-slate-400 uppercase tracking-wider mb-1">Max Confidence</h3>
                    <div class="flex items-baseline mb-1">
                        <span id="confidenceValue"
                            class="text-2xl font-bold text-white drop-shadow-[0_0_5px_rgba(255,255,255,0.5)]">0</span>
                        <span class="text-xs ml-1 text-cyan-400">%</span>
                    </div>
                    <div class="w-full bg-slate-700 h-1 rounded-full overflow-hidden">
                        <div id="confidenceBar"
                            class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full rounded-full transition-all duration-300"
                            style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div
                class="bg-slate-800 p-4 rounded-lg border border-cyan-900/50 shadow-lg flex-1 overflow-hidden flex flex-col relative min-h-0">
                <div
                    class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHBhdGggZD0iTTEgMWgydjJIMUMxeiIgZmlsbD0iIzIyZDNZWUyMiIgZmlsbC1vcGFjaXR5PSIwLjA1Ii8+PC9zdmc+')] opacity-20 pointer-events-none">
                </div>
                <h3
                    class="text-xs font-bold uppercase mb-2 border-b border-cyan-900/30 pb-1 flex justify-between z-10 shrink-0">
                    <span class="text-slate-300">Detection Log</span>
                    <span id="logCount" class="text-[10px] bg-cyan-900/50 px-1.5 py-0.5 rounded text-cyan-300">0</span>
                </h3>
                <div class="overflow-y-auto flex-1 text-[11px] space-y-1.5 font-mono z-10 pr-1" id="logContainer">
                    <div class="text-slate-600 italic border-l-2 border-slate-700 pl-2">System Ready. Waiting for data
                        stream...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // -- Three.js Robot Arm Initialization --
        let scene, camera, renderer, robotBase, robotArm;
        let isStriking = false;

        function initRobot() {
            const container = document.getElementById('robot-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, 5, 12);
            camera.lookAt(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x404040, 1.5); // Soft white light
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0x22d3ee, 2);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            // Robot Base
            const baseGeo = new THREE.CylinderGeometry(1.5, 2, 1, 32);
            const baseMat = new THREE.MeshPhongMaterial({ color: 0x334155, shininess: 100 });
            robotBase = new THREE.Mesh(baseGeo, baseMat);
            robotBase.position.y = -2;
            scene.add(robotBase);

            // Robot Body/Column
            const colGeo = new THREE.CylinderGeometry(0.5, 0.5, 4, 16);
            const colMat = new THREE.MeshPhongMaterial({ color: 0xe2e8f0, shininess: 80 });
            const column = new THREE.Mesh(colGeo, colMat);
            column.position.y = 2;
            robotBase.add(column);

            // Robot Joint
            const jointGeo = new THREE.SphereGeometry(0.8, 16, 16);
            const jointMat = new THREE.MeshPhongMaterial({ color: 0xf87171, shininess: 100 });
            const joint = new THREE.Mesh(jointGeo, jointMat);
            joint.position.y = 2;
            column.add(joint);

            // Robot Arm (striker)
            const armGeo = new THREE.BoxGeometry(0.4, 4, 0.4);
            const armMat = new THREE.MeshPhongMaterial({ color: 0xcbd5e1, shininess: 80 });
            robotArm = new THREE.Mesh(armGeo, armMat);
            // Translate geometry so it rotates from the joint instead of middle
            armGeo.translate(0, 2, 0);

            // Setup Arm hierarchy
            joint.add(robotArm);
            robotArm.rotation.x = Math.PI / 4; // idle pose

            // --- Two-Way HMI (Interactive Digital Twin) ---
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            renderer.domElement.addEventListener('pointerdown', (event) => {
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects([robotArm, robotBase, column], true);

                if (intersects.length > 0) {
                    addLog("HMI", "Robot Clicked! Dispatching PLC Stop Signal...", "info");

                    // Visual feedback
                    robotArm.material.color.setHex(0xbbf7d0); // Light green flash
                    setTimeout(() => robotArm.material.color.setHex(0xcbd5e1), 500);

                    // Send PLC signal via fetch
                    fetch('/api/system/plc/command', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ device: 'ROBOT_ARM_1', command: 'EMERGENCY_STOP', source: 'HMI_3D_VIEW' })
                    }).then(res => {
                        if (res.ok) addLog("PLC", "Signal Acknowledged", "success");
                        else addLog("PLC", "Signal Rejected", "error");
                    }).catch(e => addLog("PLC", "Network Error", "error"));
                }
            });
            // ----------------------------------------------

            function animateRobot() {
                requestAnimationFrame(animateRobot);

                // Subtle idle sway if not striking
                if (!isStriking) {
                    robotBase.rotation.y = Math.sin(Date.now() * 0.001) * 0.2;
                }

                renderer.render(scene, camera);
            }
            animateRobot();

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }

        function triggerRobotStrike() {
            if (isStriking) return;
            isStriking = true;

            const statusEl = document.getElementById('robotStatus');
            statusEl.innerText = "DEFECT ACTION!";
            statusEl.className = "absolute bottom-2 right-2 z-10 text-[9px] font-bold px-2 py-0.5 rounded bg-red-900/80 text-red-300 border border-red-500/50 uppercase tracking-widest animate-pulse";

            let strikeFrame = 0;
            const strikeDuration = 20; // Fast strike
            const returnDuration = 40; // Slow return

            function strikeAnim() {
                strikeFrame++;
                if (strikeFrame <= strikeDuration) {
                    // Strike down
                    robotArm.rotation.x -= 0.08;
                    robotBase.rotation.y += 0.05;
                    requestAnimationFrame(strikeAnim);
                } else if (strikeFrame <= strikeDuration + returnDuration) {
                    // Return slowly
                    robotArm.rotation.x += (0.08 * strikeDuration) / returnDuration;
                    robotBase.rotation.y -= (0.05 * strikeDuration) / returnDuration;
                    requestAnimationFrame(strikeAnim);
                } else {
                    isStriking = false;
                    robotArm.rotation.x = Math.PI / 4; // reset exact
                    robotBase.rotation.y = 0;
                    statusEl.innerText = "IDLE";
                    statusEl.className = "absolute bottom-2 right-2 z-10 text-[9px] font-bold px-2 py-0.5 rounded bg-cyan-900/80 text-cyan-300 border border-cyan-500/50 uppercase tracking-widest";
                }
            }
            strikeAnim();
        }

        const video = document.getElementById('webcamVideo');
        const cameras = ['cam1', 'cam2', 'cam3', 'cam4'];
        const canvasMap = {};
        const ctxMap = {};
        cameras.forEach(camId => {
            const c = document.getElementById(`overlayCanvas-${camId}`);
            if (c) {
                canvasMap[camId] = c;
                ctxMap[camId] = c.getContext('2d');
            }
        });
        const logContainer = document.getElementById('logContainer');
        const logCountEl = document.getElementById('logCount');
        const connectionStatus = document.getElementById('connectionStatus');
        const confidenceValue = document.getElementById('confidenceValue');
        const confidenceBar = document.getElementById('confidenceBar');
        const currentFpsEl = document.getElementById('currentFps');
        let stompClient = null;
        let lastFrameTime = Date.now();
        let frameCount = 0;
        let totalLogs = 0;
        const fpsData = new Array(30).fill(0);
        const chartCtx = document.getElementById('fpsChart').getContext('2d');
        const gradient = chartCtx.createLinearGradient(0, 0, 0, 100);
        gradient.addColorStop(0, 'rgba(34, 211, 238, 0.4)');
        gradient.addColorStop(1, 'rgba(34, 211, 238, 0)');
        const fpsChart = new Chart(chartCtx, {
            type: 'line',
            data: {
                labels: new Array(30).fill(''),
                datasets: [{
                    label: 'FPS',
                    data: fpsData,
                    borderColor: '#22d3ee',
                    borderWidth: 1.5,
                    backgroundColor: gradient,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    y: { beginAtZero: true, max: 20, display: false },
                    x: { display: false }
                },
                plugins: { legend: { display: false }, tooltip: { enabled: false }, layout: { padding: 0 } }
            }
        });

        async function startWebcam() {
            try {
                addLog("System", "Requesting camera permission...", "info");
                cameras.forEach(camId => {
                    const s = document.getElementById(`camStatus-${camId}`);
                    if (s) s.textContent = 'Requesting Camera Permission...';
                });
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                await video.play();
                video.onloadedmetadata = () => {
                    cameras.forEach(camId => {
                        const c = canvasMap[camId];
                        if (c) { c.width = video.videoWidth; c.height = video.videoHeight; }
                        const s = document.getElementById(`camStatus-${camId}`);
                        if (s) s.style.display = 'none';
                    });
                    addLog("System", `Webcam Initialized: ${video.videoWidth}x${video.videoHeight}`, "success");
                    startStreaming();
                };
            } catch (err) {
                addLog("System", "Webcam Access Denied: " + err.message, "error");
                cameras.forEach(camId => {
                    const s = document.getElementById(`camStatus-${camId}`);
                    if (s) { s.textContent = 'Camera Unavailable'; s.className = 'text-red-600 text-xs font-bold'; }
                });
            }
        }

        function connectWebSocket() {
            const socket = new SockJS('/ws-stomp');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;
            stompClient.connect({}, function (frame) {
                updateStatus(true);
                addLog("System", "Connected to Mainframe Network", "success");
                cameras.forEach(camId => {
                    stompClient.subscribe(`/topic/detections/${camId}`, function (message) {
                        try {
                            const body = JSON.parse(message.body);
                            handleDetection(camId, body);
                        } catch (e) { }
                    });
                });
            }, function (err) {
                updateStatus(false);
                addLog("System", "WebSocket Disconnected. Retrying...", "error");
                setTimeout(connectWebSocket, 3000);
            });
        }

        function startStreaming() {
            const offscreenCanvas = document.createElement('canvas');
            const offscreenCtx = offscreenCanvas.getContext('2d');
            // PERFORMANCE OPTIMIZATION: Downscale and skip frames to reduce DB/Network load
            offscreenCanvas.width = 640;
            offscreenCanvas.height = 480;

            let lastSendTime = 0;
            const sendInterval = 150; // ~6 FPS limit for performance

            function loop(timestamp) {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    frameCount++;
                    if (timestamp - lastFrameTime >= 1000) {
                        const fps = frameCount;
                        updateChart(fps);
                        currentFpsEl.innerText = `${fps}`;
                        frameCount = 0;
                        lastFrameTime = timestamp;
                    }

                    cameras.forEach(camId => {
                        const ctx = ctxMap[camId];
                        const cvs = canvasMap[camId];
                        if (ctx && cvs) {
                            ctx.clearRect(0, 0, cvs.width, cvs.height);
                            ctx.drawImage(video, 0, 0, cvs.width, cvs.height);
                            const dets = window.latestDetections ? window.latestDetections[camId] : null;
                            if (dets) dets.forEach(det => drawBox(ctx, det, cvs.width, cvs.height));
                        }
                    });

                    // Send Frame to AI Worker if interval elapsed
                    if (timestamp - lastSendTime > sendInterval) {
                        // Hard scale down to 640x480 for massive speed up
                        offscreenCtx.drawImage(video, 0, 0, 640, 480);

                        // JPEG compression 0.7 for fast networking while preserving Yolo precision
                        offscreenCanvas.toBlob((blob) => {
                            if (blob) {
                                cameras.forEach(camId => {
                                    const formData = new FormData();
                                    formData.append("image", blob, "frame.jpg");
                                    formData.append("camId", camId);
                                    fetch('/api/stream/frame', { method: 'POST', body: formData }).catch(() => { });
                                });
                                lastSendTime = timestamp;
                            }
                        }, 'image/jpeg', 0.7);
                    }
                }
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function drawBox(ctx, det, wd, ht) {
            let x, y, w, h;
            if (det.bbox && Array.isArray(det.bbox)) {
                [x, y, w, h] = det.bbox;
            } else {
                x = det.x || 0; y = det.y || 0; w = det.w || 0; h = det.h || 0;
            }
            // Scale bbox back up if video resolution is not 640x480 depending on screen
            const scaleX = wd / 640;
            const scaleY = ht / 480;
            x *= scaleX; y *= scaleY; w *= scaleX; h *= scaleY;

            const label = det.label || "unknown";
            const score = det.score || det.confidence || 0;
            const isDefect = label.toLowerCase().includes('defect') || label.toLowerCase().includes('ng');

            ctx.strokeStyle = isDefect ? '#ef4444' : '#22d3ee';
            ctx.lineWidth = 2;
            ctx.shadowColor = ctx.strokeStyle;
            ctx.shadowBlur = 8;
            ctx.strokeRect(x, y, w, h);
            ctx.shadowBlur = 0;

            ctx.fillStyle = isDefect ? 'rgba(239, 68, 68, 0.8)' : 'rgba(34, 211, 238, 0.8)';
            const textStr = `${label.toUpperCase()} ${Math.round(score * 100)}%`;
            ctx.font = 'bold 12px monospace';
            const textWidth = ctx.measureText(textStr).width;
            ctx.fillRect(x, (y > 20 ? y - 20 : y), textWidth + 8, 20);

            ctx.fillStyle = '#1e293b';
            ctx.fillText(textStr, x + 4, (y > 20 ? y - 6 : y + 14));
        }

        function handleDetection(camId, data) {
            if (!window.latestDetections) window.latestDetections = {};
            let detections = [];
            if (Array.isArray(data)) detections = data;
            else if (data && data.detections) detections = data.detections;

            window.latestDetections[camId] = detections;

            let maxConf = 0;
            detections.forEach(det => {
                const score = det.score || det.confidence || 0;
                if (score > maxConf) maxConf = score;
                const label = det.label || "";

                if (label.toLowerCase().includes('defect') || label.toLowerCase().includes('ng')) {
                    addLog(camId, `ALERT: ${label} DETECTED`, "error");
                    // Trigger 3D robot arm animation to strike!
                    triggerRobotStrike();
                }
            });
            const confPct = Math.round(maxConf * 100);
            animateValue(confidenceValue, parseInt(confidenceValue.innerText), confPct, 200);
            confidenceBar.style.width = `${confPct}%`;
        }

        function updateStatus(isOnline) {
            const dot = connectionStatus.children[0];
            const text = connectionStatus.children[1];
            if (isOnline) {
                dot.className = "w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee]";
                text.className = "text-xs font-bold uppercase tracking-wider text-cyan-400";
                text.innerText = "Online";
                connectionStatus.className = "flex items-center space-x-2 border border-cyan-700/50 px-3 py-1 rounded-full bg-cyan-950/30";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-red-500 animate-ping";
                text.className = "text-xs font-bold uppercase tracking-wider text-red-500";
                text.innerText = "Offline";
                connectionStatus.className = "flex items-center space-x-2 border border-red-900/50 px-3 py-1 rounded-full bg-red-950/30";
            }
        }

        function updateChart(val) {
            fpsData.shift();
            fpsData.push(val);
            fpsChart.update('active');
        }

        function addLog(source, msg, type = 'info') {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
            const div = document.createElement('div');
            div.className = "flex space-x-2 border-l-2 border-transparent hover:bg-white/5 p-1 rounded transition-colors items-center";
            let color = 'text-cyan-300';
            let border = 'border-slate-800';

            if (type === 'error') {
                color = 'text-red-400 font-bold';
                border = 'border-red-500 bg-red-950/20';
            } else if (type === 'success') {
                color = 'text-green-400';
                border = 'border-green-500';
            }
            div.classList.replace('border-transparent', border);
            div.innerHTML = `
                <span class="text-slate-500 text-[9px] w-12 shrink-0">[${time}]</span> 
                <span class="text-slate-400 font-bold w-12 shrink-0 text-[10px] uppercase">${source}:</span> 
                <span class="${color} flex-1 truncate text-xs">${msg}</span>`;
            logContainer.prepend(div);
            totalLogs++;
            logCountEl.innerText = totalLogs;

            if (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        window.addEventListener('load', () => {
            initRobot();
            connectWebSocket();
            startWebcam();
            addLog("System", "Interface Loaded. Standing by...", "info");
        });
    </script>
</body>

</html>
