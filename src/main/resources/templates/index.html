<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SmartFactory Vision Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
        }

        .neon-border {
            box-shadow: 0 0 10px #22d3ee, 0 0 20px #22d3ee inset;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 10px #22d3ee;
            animation: scan 2s linear infinite;
            z-index: 10;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: 0%;
                opacity: 0;
            }

            5% {
                opacity: 1;
            }

            95% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>

<body class="bg-slate-900 text-cyan-400 h-screen overflow-hidden flex flex-col">
    <header class="flex justify-between items-center p-4 border-b border-cyan-800 bg-slate-950 shadow-lg z-50">
        <div class="flex items-center space-x-3">
            <svg class="w-8 h-8 text-cyan-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
            </svg>
            <h1
                class="text-2xl font-bold tracking-widest uppercase text-cyan-300 drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]">
                SmartFactory<span class="text-white">Vision</span>
            </h1>
        </div>
        <nav class="flex space-x-4">
            <a href="/"
                class="px-3 py-1 bg-cyan-900/30 text-cyan-300 rounded border border-cyan-500/50 shadow-[0_0_10px_rgba(34,211,238,0.2)] text-xs font-bold uppercase tracking-wider">Dashboard</a>
            <a href="/history"
                class="px-3 py-1 bg-slate-800 hover:bg-cyan-900/50 text-slate-400 hover:text-cyan-300 rounded border border-transparent hover:border-cyan-500/50 transition-all text-xs font-bold uppercase tracking-wider">Analysis</a>
        </nav>
        <div class="flex items-center space-x-4">
            <div id="connectionStatus"
                class="flex items-center space-x-2 border border-slate-700 px-3 py-1 rounded-full bg-slate-900">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                <span class="text-xs font-bold uppercase tracking-wider text-red-500">Offline</span>
            </div>
            <div class="text-[10px] text-slate-500 tracking-widest">SYS.VER.1.0</div>
        </div>
    </header>
    <main class="flex-1 grid grid-cols-12 gap-4 p-4 min-h-0">
        <div class="col-span-8 grid grid-cols-2 grid-rows-2 gap-4 h-full min-h-0">
            <div
                class="relative bg-slate-800 rounded-lg border border-cyan-900 overflow-hidden shadow-[0_0_20px_rgba(0,0,0,0.5)] group">
                <div
                    class="absolute top-2 left-2 z-20 bg-black/70 px-2 py-0.5 rounded text-[10px] border border-cyan-500/30 text-cyan-200 tracking-wider">
                    CAM-01</div>
                <div class="scan-line opacity-50"></div>
                <div class="relative w-full h-full bg-black flex items-center justify-center">
                    <canvas id="overlayCanvas-cam1" class="absolute w-full h-full z-10 pointer-events-none"></canvas>
                </div>
            </div>
            <div
                class="relative bg-slate-800 rounded-lg border border-cyan-900 overflow-hidden shadow-[0_0_20px_rgba(0,0,0,0.5)] group">
                <div
                    class="absolute top-2 left-2 z-20 bg-black/70 px-2 py-0.5 rounded text-[10px] border border-cyan-500/30 text-cyan-200 tracking-wider">
                    CAM-02</div>
                <div class="scan-line opacity-30"></div>
                <div class="relative w-full h-full bg-black flex items-center justify-center">
                    <canvas id="overlayCanvas-cam2" class="absolute w-full h-full z-10 pointer-events-none"></canvas>
                </div>
            </div>
            <div
                class="relative bg-slate-800 rounded-lg border border-cyan-900 overflow-hidden shadow-[0_0_20px_rgba(0,0,0,0.5)] group">
                <div
                    class="absolute top-2 left-2 z-20 bg-black/70 px-2 py-0.5 rounded text-[10px] border border-cyan-500/30 text-cyan-200 tracking-wider">
                    CAM-03</div>
                <div class="scan-line opacity-30"></div>
                <div class="relative w-full h-full bg-black flex items-center justify-center">
                    <canvas id="overlayCanvas-cam3" class="absolute w-full h-full z-10 pointer-events-none"></canvas>
                </div>
            </div>
            <div
                class="relative bg-slate-800 rounded-lg border border-cyan-900 overflow-hidden shadow-[0_0_20px_rgba(0,0,0,0.5)] group">
                <div
                    class="absolute top-2 left-2 z-20 bg-black/70 px-2 py-0.5 rounded text-[10px] border border-cyan-500/30 text-cyan-200 tracking-wider">
                    CAM-04</div>
                <div class="scan-line opacity-30"></div>
                <div class="relative w-full h-full bg-black flex items-center justify-center">
                    <canvas id="overlayCanvas-cam4" class="absolute w-full h-full z-10 pointer-events-none"></canvas>
                </div>
            </div>
            <video id="webcamVideo" autoplay playsinline muted class="hidden"></video>
        </div>
        <div class="col-span-4 flex flex-col space-y-4 min-h-0">
            <div class="bg-slate-800 p-4 rounded-lg border border-cyan-900/50 shadow-lg h-48 flex flex-col">
                <div class="flex justify-between items-center mb-2 border-b border-cyan-900/30 pb-1">
                    <h3 class="text-xs font-bold uppercase text-slate-300">System Load / FPS</h3>
                    <span id="currentFps" class="text-xs text-cyan-300">0 FPS</span>
                </div>
                <div class="flex-1 relative w-full h-full">
                    <canvas id="fpsChart"></canvas>
                </div>
            </div>
            <div
                class="bg-slate-800 p-4 rounded-lg border border-cyan-900/50 shadow-lg h-24 flex items-center justify-between relative overflow-hidden">
                <div class="z-10 relative">
                    <h3 class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Max Confidence</h3>
                    <div class="flex items-baseline">
                        <span id="confidenceValue"
                            class="text-3xl font-bold text-white drop-shadow-[0_0_5px_rgba(255,255,255,0.5)]">0</span>
                        <span class="text-sm ml-1 text-cyan-400">%</span>
                    </div>
                </div>
                <div class="w-1/2 flex flex-col space-y-1 z-10">
                    <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
                        <div id="confidenceBar"
                            class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full rounded-full transition-all duration-300"
                            style="width: 0%"></div>
                    </div>
                    <div class="text-[10px] text-right text-slate-500">AI PROBABILITY</div>
                </div>
                <div class="absolute right-0 top-0 w-24 h-24 bg-cyan-500/5 rounded-full blur-2xl -mr-4 -mt-4"></div>
            </div>
            <div
                class="bg-slate-800 p-4 rounded-lg border border-cyan-900/50 shadow-lg flex-1 overflow-hidden flex flex-col relative">
                <div
                    class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHBhdGggZD0iTTEgMWgydjJIMUMxeiIgZmlsbD0iIzIyZDNZWUyMiIgZmlsbC1vcGFjaXR5PSIwLjA1Ii8+PC9zdmc+')] opacity-20 pointer-events-none">
                </div>
                <h3 class="text-xs font-bold uppercase mb-2 border-b border-cyan-900/30 pb-1 flex justify-between z-10">
                    <span class="text-slate-300">Detection Log</span>
                    <span id="logCount" class="text-[10px] bg-cyan-900/50 px-1.5 py-0.5 rounded text-cyan-300">0</span>
                </h3>
                <div class="overflow-y-auto flex-1 text-[11px] space-y-1.5 font-mono z-10 pr-1" id="logContainer">
                    <div class="text-slate-600 italic border-l-2 border-slate-700 pl-2">System Ready. Waiting for data
                        stream...</div>
                </div>
            </div>
        </div>
    </main>
    <script>
        const video = document.getElementById('webcamVideo');
        const cameras = ['cam1', 'cam2', 'cam3', 'cam4'];
        const canvasMap = {};
        const ctxMap = {};
        cameras.forEach(camId => {
            const c = document.getElementById(`overlayCanvas-${camId}`);
            if (c) {
                canvasMap[camId] = c;
                ctxMap[camId] = c.getContext('2d');
            }
        });
        const logContainer = document.getElementById('logContainer');
        const logCountEl = document.getElementById('logCount');
        const connectionStatus = document.getElementById('connectionStatus');
        const confidenceValue = document.getElementById('confidenceValue');
        const confidenceBar = document.getElementById('confidenceBar');
        const currentFpsEl = document.getElementById('currentFps');
        let stompClient = null;
        let lastFrameTime = Date.now();
        let frameCount = 0;
        let totalLogs = 0;
        const fpsData = new Array(30).fill(0);
        const chartCtx = document.getElementById('fpsChart').getContext('2d');
        const gradient = chartCtx.createLinearGradient(0, 0, 0, 200);
        gradient.addColorStop(0, 'rgba(34, 211, 238, 0.4)');
        gradient.addColorStop(1, 'rgba(34, 211, 238, 0)');
        const fpsChart = new Chart(chartCtx, {
            type: 'line',
            data: {
                labels: new Array(30).fill(''),
                datasets: [{
                    label: 'FPS',
                    data: fpsData,
                    borderColor: '#22d3ee',
                    borderWidth: 1.5,
                    backgroundColor: gradient,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 60,
                        grid: { color: '#1e293b', drawBorder: false },
                        ticks: { color: '#64748b', font: { size: 9 } }
                    },
                    x: { display: false }
                },
                plugins: { legend: { display: false }, tooltip: { enabled: false } }
            }
        });
        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "environment" }
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    cameras.forEach(camId => {
                        const c = canvasMap[camId];
                        if (c) {
                            c.width = video.videoWidth;
                            c.height = video.videoHeight;
                        }
                    });
                    addLog("System", `Webcam Initialized: ${video.videoWidth}x${video.videoHeight}`, "success");
                    startStreaming();
                };
            } catch (err) {
                addLog("System", "Webcam Access Denied: " + err.message, "error");
            }
        }
        function connectWebSocket() {
            const socket = new SockJS('/ws-stomp');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;
            stompClient.connect({}, function (frame) {
                updateStatus(true);
                addLog("System", "Connected to Mainframe Network", "success");
                cameras.forEach(camId => {
                    stompClient.subscribe(`/topic/detections/${camId}`, function (message) {
                        try {
                            const body = JSON.parse(message.body);
                            handleDetection(camId, body);
                        } catch (e) { }
                    });
                });
            }, function (err) {
                updateStatus(false);
                addLog("System", "WebSocket Disconnected. Retrying...", "error");
                setTimeout(connectWebSocket, 3000);
            });
        }
        function startStreaming() {
            const offscreenCanvas = document.createElement('canvas');
            const offscreenCtx = offscreenCanvas.getContext('2d');
            let lastSendTime = 0;
            const sendInterval = 40;
            function loop(timestamp) {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    frameCount++;
                    if (timestamp - lastFrameTime >= 1000) {
                        const fps = frameCount;
                        updateChart(fps);
                        currentFpsEl.innerText = `${fps} FPS`;
                        frameCount = 0;
                        lastFrameTime = timestamp;
                    }
                    cameras.forEach(camId => {
                        const ctx = ctxMap[camId];
                        const cvs = canvasMap[camId];
                        if (ctx && cvs) {
                            ctx.drawImage(video, 0, 0, cvs.width, cvs.height);
                            const dets = window.latestDetections ? window.latestDetections[camId] : null;
                            if (dets) {
                                dets.forEach(det => drawBox(ctx, det));
                            }
                        }
                    });
                    if (timestamp - lastSendTime > sendInterval) {
                        offscreenCanvas.width = video.videoWidth;
                        offscreenCanvas.height = video.videoHeight;
                        offscreenCtx.drawImage(video, 0, 0);
                        offscreenCanvas.toBlob((blob) => {
                            if (blob) {
                                cameras.forEach(camId => {
                                    const formData = new FormData();
                                    formData.append("image", blob, "frame.jpg");
                                    formData.append("camId", camId);
                                    fetch('/api/stream/frame', {
                                        method: 'POST',
                                        body: formData,
                                    }).catch(() => { });
                                });
                                lastSendTime = timestamp;
                            }
                        }, 'image/jpeg', 0.6);
                    }
                }
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }
        function drawBox(ctx, det) {
            const x = det.x || 0;
            const y = det.y || 0;
            const w = det.w || 0;
            const h = det.h || 0;
            const label = det.label || "unknown";
            const score = det.score || det.confidence || 0;
            ctx.strokeStyle = label.toLowerCase().includes('defect') ? '#ff0000' : '#22d3ee';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);
            ctx.fillStyle = ctx.strokeStyle;
            ctx.font = '12px monospace';
            ctx.fillText(`${label} ${Math.round(score * 100)}%`, x, y > 15 ? y - 5 : y + 15);
        }
        function handleDetection(camId, data) {
            if (!window.latestDetections) window.latestDetections = {};
            let detections = [];
            if (Array.isArray(data)) detections = data;
            else if (data && data.detections) detections = data.detections;
            window.latestDetections[camId] = detections;
            let maxConf = 0;
            detections.forEach(det => {
                const score = det.score || det.confidence || 0;
                if (score > maxConf) maxConf = score;
                const label = det.label || "";
                if (label.toLowerCase().includes('defect')) {
                    addLog(camId, `ALERT: ${label}`, "error");
                }
            });
            const confPct = Math.round(maxConf * 100);
            animateValue(confidenceValue, parseInt(confidenceValue.innerText), confPct, 200);
            confidenceBar.style.width = `${confPct}%`;
        }
        function updateStatus(isOnline) {
            const dot = connectionStatus.children[0];
            const text = connectionStatus.children[1];
            if (isOnline) {
                dot.className = "w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee]";
                text.className = "text-xs font-bold uppercase tracking-wider text-cyan-400";
                text.innerText = "Online";
                connectionStatus.className = "flex items-center space-x-2 border border-cyan-700/50 px-3 py-1 rounded-full bg-cyan-950/30";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-red-500 animate-ping";
                text.className = "text-xs font-bold uppercase tracking-wider text-red-500";
                text.innerText = "Offline";
                connectionStatus.className = "flex items-center space-x-2 border border-red-900/50 px-3 py-1 rounded-full bg-red-950/30";
            }
        }
        function updateChart(val) {
            fpsData.shift();
            fpsData.push(val);
            fpsChart.update('active');
        }
        function addLog(source, msg, type = 'info') {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
            const div = document.createElement('div');
            div.className = "flex space-x-2 border-l-2 border-transparent hover:bg-white/5 p-0.5 rounded transition-colors";
            let color = 'text-cyan-300';
            let border = 'border-slate-800';
            if (type === 'error') {
                color = 'text-red-400 font-bold';
                border = 'border-red-500';
            } else if (type === 'success') {
                color = 'text-green-400';
                border = 'border-green-500';
            }
            div.classList.replace('border-transparent', border);
            div.innerHTML = `
                <span class="text-slate-600 text-[10px] w-14 shrinking-0">[${time}]</span> 
                <span class="text-slate-400 font-bold w-16 shrinking-0 text-[10px]">${source}:</span> 
                <span class="${color} flex-1 truncate">${msg}</span>`;
            logContainer.prepend(div);
            totalLogs++;
            logCountEl.innerText = totalLogs;
            if (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }
        window.addEventListener('load', () => {
            connectWebSocket();
            startWebcam();
            addLog("System", "Interface Loaded. Standing by...", "info");
        });
    </script>
</body>

</html>
