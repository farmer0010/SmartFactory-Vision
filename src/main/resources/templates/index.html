<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SmartFactory Vision Control</title>

    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom Styles for Sci-Fi Theme -->
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            /* Tech mono font */
        }

        .neon-border {
            box-shadow: 0 0 10px #22d3ee, 0 0 20px #22d3ee inset;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 10px #22d3ee;
            animation: scan 2s linear infinite;
            z-index: 10;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: 0%;
                opacity: 0;
            }

            5% {
                opacity: 1;
            }

            95% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>

<body class="bg-slate-900 text-cyan-400 h-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="flex justify-between items-center p-4 border-b border-cyan-800 bg-slate-950 shadow-lg z-50">
        <div class="flex items-center space-x-3">
            <svg class="w-8 h-8 text-cyan-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
            </svg>
            <h1
                class="text-2xl font-bold tracking-widest uppercase text-cyan-300 drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]">
                SmartFactory<span class="text-white">Vision</span></h1>
        </div>
        <div class="flex items-center space-x-4">
            <div id="connectionStatus"
                class="flex items-center space-x-2 border border-slate-700 px-3 py-1 rounded-full bg-slate-900">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                <span class="text-xs font-bold uppercase tracking-wider text-red-500">Offline</span>
            </div>
            <div class="text-[10px] text-slate-500 tracking-widest">SYS.VER.1.0</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 grid grid-cols-12 gap-4 p-4 min-h-0">

        <!-- Left Panel: Video Stream -->
        <div
            class="col-span-8 bg-slate-800 rounded-lg border border-cyan-900 overflow-hidden relative shadow-[0_0_20px_rgba(0,0,0,0.5)] flex flex-col">
            <div
                class="absolute top-4 left-4 z-20 bg-black/70 px-2 py-1 rounded text-[10px] border border-cyan-500/30 text-cyan-200 tracking-wider">
                CAM-01 LIVE FEED</div>
            <div class="scan-line"></div>

            <!-- Video & Canvas Wrapper -->
            <div class="relative flex-1 bg-black flex items-center justify-center">
                <video id="webcamVideo" autoplay playsinline muted
                    class="absolute w-full h-full object-cover opacity-90"></video>
                <canvas id="overlayCanvas" class="absolute w-full h-full z-10 pointer-events-none"></canvas>
            </div>
        </div>

        <!-- Right Panel: Stats & Logs -->
        <div class="col-span-4 flex flex-col space-y-4 min-h-0">

            <!-- FPS Chart -->
            <div class="bg-slate-800 p-4 rounded-lg border border-cyan-900/50 shadow-lg h-48 flex flex-col">
                <div class="flex justify-between items-center mb-2 border-b border-cyan-900/30 pb-1">
                    <h3 class="text-xs font-bold uppercase text-slate-300">System Load / FPS</h3>
                    <span id="currentFps" class="text-xs text-cyan-300">0 FPS</span>
                </div>
                <div class="flex-1 relative w-full h-full">
                    <canvas id="fpsChart"></canvas>
                </div>
            </div>

            <!-- Current Detection Confidence -->
            <div
                class="bg-slate-800 p-4 rounded-lg border border-cyan-900/50 shadow-lg h-24 flex items-center justify-between relative overflow-hidden">
                <div class="z-10 relative">
                    <h3 class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Max Confidence</h3>
                    <div class="flex items-baseline">
                        <span id="confidenceValue"
                            class="text-3xl font-bold text-white drop-shadow-[0_0_5px_rgba(255,255,255,0.5)]">0</span>
                        <span class="text-sm ml-1 text-cyan-400">%</span>
                    </div>
                </div>
                <!-- Progress Circular or Bar -->
                <div class="w-1/2 flex flex-col space-y-1 z-10">
                    <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
                        <div id="confidenceBar"
                            class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full rounded-full transition-all duration-300"
                            style="width: 0%"></div>
                    </div>
                    <div class="text-[10px] text-right text-slate-500">AI PROBABILITY</div>
                </div>
                <!-- Background decorative element -->
                <div class="absolute right-0 top-0 w-24 h-24 bg-cyan-500/5 rounded-full blur-2xl -mr-4 -mt-4"></div>
            </div>

            <!-- Detection Log -->
            <div
                class="bg-slate-800 p-4 rounded-lg border border-cyan-900/50 shadow-lg flex-1 overflow-hidden flex flex-col relative">
                <div
                    class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHBhdGggZD0iTTEgMWgydjJIMUMxeiIgZmlsbD0iIzIyZDNZWUyMiIgZmlsbC1vcGFjaXR5PSIwLjA1Ii8+PC9zdmc+')] opacity-20 pointer-events-none">
                </div>
                <h3 class="text-xs font-bold uppercase mb-2 border-b border-cyan-900/30 pb-1 flex justify-between z-10">
                    <span class="text-slate-300">Detection Log</span>
                    <span id="logCount" class="text-[10px] bg-cyan-900/50 px-1.5 py-0.5 rounded text-cyan-300">0</span>
                </h3>
                <div class="overflow-y-auto flex-1 text-[11px] space-y-1.5 font-mono z-10 pr-1" id="logContainer">
                    <div class="text-slate-600 italic border-l-2 border-slate-700 pl-2">System Ready. Waiting for data
                        stream...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script>
        const video = document.getElementById('webcamVideo');
        const canvas = document.getElementById('overlayCanvas');
        const ctx = canvas.getContext('2d');

        const logContainer = document.getElementById('logContainer');
        const logCountEl = document.getElementById('logCount');
        const connectionStatus = document.getElementById('connectionStatus');
        const confidenceValue = document.getElementById('confidenceValue');
        const confidenceBar = document.getElementById('confidenceBar');
        const currentFpsEl = document.getElementById('currentFps');

        let stompClient = null;
        let lastFrameTime = Date.now();
        let frameCount = 0;
        let totalLogs = 0;

        // FPS Chart Setup
        const fpsData = new Array(30).fill(0);
        const chartCtx = document.getElementById('fpsChart').getContext('2d');

        // Custom Gradient for Chart
        const gradient = chartCtx.createLinearGradient(0, 0, 0, 200);
        gradient.addColorStop(0, 'rgba(34, 211, 238, 0.4)');
        gradient.addColorStop(1, 'rgba(34, 211, 238, 0)');

        const fpsChart = new Chart(chartCtx, {
            type: 'line',
            data: {
                labels: new Array(30).fill(''),
                datasets: [{
                    label: 'FPS',
                    data: fpsData,
                    borderColor: '#22d3ee',
                    borderWidth: 1.5,
                    backgroundColor: gradient,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false, // Performance optimization
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 60,
                        grid: { color: '#1e293b', drawBorder: false },
                        ticks: { color: '#64748b', font: { size: 9 } }
                    },
                    x: { display: false }
                },
                plugins: { legend: { display: false }, tooltip: { enabled: false } }
            }
        });

        // 1. Webcam Initialization
        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "environment" }
                });
                video.srcObject = stream;

                // Wait for metadata to set canvas size
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    addLog("System", `Webcam Initialized: ${video.videoWidth}x${video.videoHeight}`, "success");
                    startStreaming(); // Start streaming only after video is ready
                };
            } catch (err) {
                console.error("Webcam Error:", err);
                addLog("System", "Webcam Access Denied: " + err.message, "error");
            }
        }

        // 2. WebSocket Connection
        function connectWebSocket() {
            const socket = new SockJS('/ws-stomp');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // Disable debug logs

            stompClient.connect({}, function (frame) {
                updateStatus(true);
                addLog("System", "Connected to Mainframe Network", "success");

                stompClient.subscribe('/topic/detections', function (message) {
                    try {
                        const body = JSON.parse(message.body);
                        handleDetection(body);
                    } catch (e) {
                        console.error("JSON Parse Error", e);
                    }
                });
            }, function (err) {
                updateStatus(false);
                addLog("System", "WebSocket Disconnected. Retrying...", "error");
                setTimeout(connectWebSocket, 3000); // Reconnect
            });
        }

        // 3. Frame Sender (~30 FPS)
        function startStreaming() {
            const offscreenCanvas = document.createElement('canvas');
            const offscreenCtx = offscreenCanvas.getContext('2d');

            // Using requestAnimationFrame for smoother UI, but throttle sending
            let lastSendTime = 0;
            const sendInterval = 40; // ~25 FPS target for upload

            function loop(timestamp) {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {

                    // FPS Calculation
                    frameCount++;
                    if (timestamp - lastFrameTime >= 1000) {
                        const fps = frameCount;
                        updateChart(fps);
                        currentFpsEl.innerText = `${fps} FPS`;
                        frameCount = 0;
                        lastFrameTime = timestamp;
                    }

                    // Send Frame to Server
                    if (timestamp - lastSendTime > sendInterval) {
                        offscreenCanvas.width = video.videoWidth;
                        offscreenCanvas.height = video.videoHeight;
                        offscreenCtx.drawImage(video, 0, 0);

                        offscreenCanvas.toBlob((blob) => {
                            if (blob) {
                                const formData = new FormData();
                                formData.append("image", blob, "frame.jpg");

                                // Fire-and-forget upload
                                fetch('/api/stream/frame', {
                                    method: 'POST',
                                    body: formData,
                                    // keepalive: true // optional
                                }).then(response => {
                                    if (!response.ok) addLog("Network", "Server Error: " + response.status, "error");
                                }).catch((err) => {
                                    addLog("Network", "Upload Fail: " + err.message, "error");
                                    console.error(err);
                                });

                                lastSendTime = timestamp;
                            }
                        }, 'image/jpeg', 0.6); // Quality 0.6 for speed
                    }
                }
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        // 4. Detection Logic
        function handleDetection(data) {
            // Clear previous drawings
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Robust parsing: handle raw list or object with 'detections' key
            let detections = [];
            if (Array.isArray(data)) detections = data;
            else if (data && data.detections) detections = data.detections;

            // If data is just a rough JSON string from Python that hasn't been parsed yet?
            // The JPyRustService code I wrote returns a String. 
            // In WebcamController, we pass that String to WebSocket.
            // So message.body is that String. Check if it needs double parsing?
            // Usually message.body IS the string. JSON.parse(message.body) should be the Object.
            // If Python returned a string representation of a list, it acts as JSON.
            // WE ASSUME Python returns valid JSON string.

            let maxConf = 0;

            if (detections.length > 0) {
                detections.forEach(det => {
                    // Expecting [x, y, w, h] or similar. Adapt if needed.
                    // If Python returns [x1, y1, x2, y2], we need to calc w/h.
                    // For now, let's assume JPyRust returns [x, y, w, h] as standard.
                    // If not, we might see odd boxes.
                    let x, y, w, h;
                    if (Array.isArray(det.bbox)) {
                        [x, y, w, h] = det.bbox;
                    }

                    const label = det.label || "Object";
                    const score = det.score || det.confidence || 0;

                    // Style Choice
                    const isDefect = label.toLowerCase().includes('defect') || label.toLowerCase().includes('bad');

                    ctx.save();
                    if (isDefect) {
                        ctx.strokeStyle = '#ef4444'; // Red
                        ctx.shadowColor = '#ef4444';
                    } else {
                        ctx.strokeStyle = '#22d3ee'; // Cyan
                        ctx.shadowColor = '#22d3ee';
                    }

                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 10;
                    ctx.strokeRect(x, y, w, h);

                    // Label Background
                    ctx.fillStyle = isDefect ? 'rgba(239, 68, 68, 0.8)' : 'rgba(34, 211, 238, 0.8)';
                    const text = `${label} ${(score * 100).toFixed(0)}%`;
                    const textWidth = ctx.measureText(text).width;
                    ctx.fillRect(x, y - 20, textWidth + 10, 20);

                    // Label Text
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 12px Courier New';
                    ctx.fillText(text, x + 5, y - 5);
                    ctx.restore();

                    // Log critical detections
                    if (isDefect) {
                        addLog("AI-CORE", `ALERT: ${label} detected (${(score * 100).toFixed(0)}%)`, "error");
                    }

                    if (score > maxConf) maxConf = score;
                });
            }

            // Update Confidence Gauge
            const confPct = Math.round(maxConf * 100);
            // Animate values
            animateValue(confidenceValue, parseInt(confidenceValue.innerText), confPct, 200);
            confidenceBar.style.width = `${confPct}%`;

            // Color shift based on confidence match
            if (confPct > 80) confidenceBar.className = "bg-gradient-to-r from-cyan-400 to-green-400 h-full rounded-full transition-all duration-300";
            else confidenceBar.className = "bg-gradient-to-r from-cyan-500 to-blue-500 h-full rounded-full transition-all duration-300";
        }

        // Helper: Status UI
        function updateStatus(isOnline) {
            const dot = connectionStatus.children[0];
            const text = connectionStatus.children[1];
            if (isOnline) {
                dot.className = "w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee]";
                text.className = "text-xs font-bold uppercase tracking-wider text-cyan-400";
                text.innerText = "Online";
                connectionStatus.className = "flex items-center space-x-2 border border-cyan-700/50 px-3 py-1 rounded-full bg-cyan-950/30";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-red-500 animate-ping";
                text.className = "text-xs font-bold uppercase tracking-wider text-red-500";
                text.innerText = "Offline";
                connectionStatus.className = "flex items-center space-x-2 border border-red-900/50 px-3 py-1 rounded-full bg-red-950/30";
            }
        }

        // Helper: Chart Update
        function updateChart(val) {
            fpsData.shift();
            fpsData.push(val);
            fpsChart.update('active');
        }

        // Helper: Logging
        function addLog(source, msg, type = 'info') {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
            const div = document.createElement('div');
            div.className = "flex space-x-2 border-l-2 border-transparent hover:bg-white/5 p-0.5 rounded transition-colors";

            let color = 'text-cyan-300';
            let border = 'border-slate-800';

            if (type === 'error') {
                color = 'text-red-400 font-bold';
                border = 'border-red-500';
            } else if (type === 'success') {
                color = 'text-green-400';
                border = 'border-green-500';
            }

            div.classList.replace('border-transparent', border);

            div.innerHTML = `
                <span class="text-slate-600 text-[10px] w-14 shrinking-0">[${time}]</span> 
                <span class="text-slate-400 font-bold w-16 shrinking-0 text-[10px]">${source}:</span> 
                <span class="${color} flex-1 truncate">${msg}</span>`;

            logContainer.prepend(div);
            totalLogs++;
            logCountEl.innerText = totalLogs;

            // Limit DOM elements
            if (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // Boot
        window.addEventListener('load', () => {
            connectWebSocket();
            startWebcam(); // Camera init triggers stream start
            addLog("System", "Interface Loaded. Standing by...", "info");
        });

    </script>
</body>

</html>
