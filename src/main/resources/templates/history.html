<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SmartFactory Vision - History</title>
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
        }

        .neon-border {
            box-shadow: 0 0 10px #22d3ee, 0 0 20px #22d3ee inset;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>

<body class="bg-slate-900 text-cyan-400 h-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="flex justify-between items-center p-4 border-b border-cyan-800 bg-slate-950 shadow-lg z-50">
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-3">
                <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <h1
                    class="text-2xl font-bold tracking-widest uppercase text-cyan-300 drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]">
                    HISTORY<span class="text-white">LOGs</span>
                </h1>
            </div>
            <!-- Navigation -->
            <nav class="flex space-x-4">
                <a href="/"
                    class="px-3 py-1 bg-slate-800 hover:bg-cyan-900/50 text-slate-400 hover:text-cyan-300 rounded border border-transparent hover:border-cyan-500/50 transition-all text-xs font-bold uppercase tracking-wider">
                    Dashboard
                </a>
                <a href="/history"
                    class="px-3 py-1 bg-cyan-900/30 text-cyan-300 rounded border border-cyan-500/50 shadow-[0_0_10px_rgba(34,211,238,0.2)] text-xs font-bold uppercase tracking-wider">
                    Analysis
                </a>
            </nav>
        </div>
        <div class="text-[10px] text-slate-500 tracking-widest">DB.STATUS: CONNECTED</div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 grid grid-cols-12 gap-4 p-4 min-h-0">

        <!-- Left Panel: Log Table -->
        <div class="col-span-8 bg-slate-800 rounded-lg border border-cyan-900 overflow-hidden flex flex-col shadow-lg">
            <div class="p-3 border-b border-cyan-900/50 bg-slate-900/50 flex justify-between items-center">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300">Detection Records</h2>
                <button onclick="loadLogs()"
                    class="px-2 py-1 bg-slate-700 hover:bg-cyan-800 text-xs rounded text-white transition-colors">
                    REFRESH
                </button>
            </div>

            <div class="flex-1 overflow-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-900 text-slate-400 sticky top-0 z-10">
                        <tr>
                            <th class="p-3 font-bold uppercase tracking-wider">Time</th>
                            <th class="p-3 font-bold uppercase tracking-wider">Label</th>
                            <th class="p-3 font-bold uppercase tracking-wider">Conf(%)</th>
                            <th class="p-3 font-bold uppercase tracking-wider">Status</th>
                            <th class="p-3 font-bold uppercase tracking-wider">Cam ID</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody" class="divide-y divide-slate-700/50">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-slate-500 italic">Loading data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination (Simple) -->
            <div class="p-2 border-t border-cyan-900/50 bg-slate-900/50 flex justify-center space-x-2">
                <button id="prevBtn" onclick="changePage(-1)"
                    class="px-3 py-1 bg-slate-700 disabled:opacity-50 text-xs rounded">PREV</button>
                <span id="pageInfo" class="text-xs self-center">Page 1</span>
                <button id="nextBtn" onclick="changePage(1)"
                    class="px-3 py-1 bg-slate-700 disabled:opacity-50 text-xs rounded">NEXT</button>
            </div>
        </div>

        <!-- Right Panel: Statistics -->
        <div class="col-span-4 flex flex-col space-y-4">
            <!-- Stats Summary -->
            <div class="bg-slate-800 p-4 rounded-lg border border-cyan-900 h-full flex flex-col">
                <h3 class="text-xs font-bold uppercase text-slate-300 mb-4 border-b border-cyan-900/30 pb-2">Defect
                    Analysis (24h)</h3>
                <div class="flex-1 relative">
                    <canvas id="statsChart"></canvas>
                </div>
                <div class="mt-4 grid grid-cols-2 gap-2 text-center">
                    <div class="bg-slate-900 p-2 rounded border border-red-900/50">
                        <div class="text-[10px] text-red-500 uppercase">Total Defects</div>
                        <div id="totalDefects" class="text-xl font-bold text-red-400">0</div>
                    </div>
                    <div class="bg-slate-900 p-2 rounded border border-cyan-900/50">
                        <div class="text-[10px] text-cyan-500 uppercase">Avg Confidence</div>
                        <div class="text-xl font-bold text-cyan-400">--%</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentPage = 0;
        const pageSize = 20;

        // Load Logs
        async function loadLogs() {
            try {
                const res = await fetch(`/api/history?page=${currentPage}&size=${pageSize}`);
                const data = await res.json();
                renderTable(data.content);
                updatePagination(data);
            } catch (err) {
                console.error(err);
            }
            loadStats();
        }

        function renderTable(logs) {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';

            if (!logs || logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-500 italic">No records found.</td></tr>';
                return;
            }

            logs.forEach(log => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-cyan-900/10 transition-colors cursor-default";

                const time = new Date(log.timestamp).toLocaleString();
                const isDefect = log.defect; // boolean

                const statusHtml = isDefect
                    ? `<span class="px-2 py-0.5 rounded-full bg-red-900/50 text-red-400 border border-red-500/30 text-[10px] font-bold">DEFECT</span>`
                    : `<span class="px-2 py-0.5 rounded-full bg-green-900/50 text-green-400 border border-green-500/30 text-[10px] font-bold">OK</span>`;

                tr.innerHTML = `
                    <td class="p-3 text-slate-300">${time}</td>
                    <td class="p-3 font-bold text-white">${log.label}</td>
                    <td class="p-3 text-cyan-300">${(log.confidence * 100).toFixed(1)}%</td>
                    <td class="p-3">${statusHtml}</td>
                    <td class="p-3 text-slate-500">${log.cameraId || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updatePagination(data) {
            document.getElementById('pageInfo').innerText = `Page ${data.number + 1} of ${data.totalPages}`;
            document.getElementById('prevBtn').disabled = data.first;
            document.getElementById('nextBtn').disabled = data.last;
        }

        function changePage(delta) {
            currentPage += delta;
            loadLogs();
        }

        // Stats Chart
        let chartInstance = null;
        async function loadStats() {
            try {
                const res = await fetch('/api/history/stats');
                const stats = await res.json(); // List<Map<String, Object>> (hour, count)

                // Aggregate total
                let total = 0;
                const labels = [];
                const data = [];

                stats.forEach(item => {
                    labels.push(item.HOUR + ":00");
                    data.push(item.COUNT);
                    total += item.COUNT;
                });

                document.getElementById('totalDefects').innerText = total;

                // Render Chart
                const ctx = document.getElementById('statsChart').getContext('2d');
                if (chartInstance) chartInstance.destroy();

                chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Defects',
                            data: data,
                            backgroundColor: 'rgba(239, 68, 68, 0.5)',
                            borderColor: '#ef4444',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { beginAtZero: true, grid: { color: '#1e293b' } },
                            x: { grid: { display: false } }
                        },
                        plugins: { legend: { display: false } }
                    }
                });

            } catch (e) { console.error(e); }
        }

        window.onload = loadLogs;
    </script>
</body>

</html>
