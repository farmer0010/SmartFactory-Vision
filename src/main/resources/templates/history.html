<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFactory Vision — 검출 이력</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif;
        }

        .sidebar {
            width: 220px;
            flex-shrink: 0;
        }

        .nav-link {
            transition: all 0.15s ease;
        }

        .nav-link.active {
            background: #EFF6FF;
            color: #1A56DB;
            border-left: 3px solid #1A56DB;
        }

        .nav-link:not(.active):hover {
            background: #F8FAFC;
            color: #1A56DB;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .table-row:hover td {
            background: #F0F7FF;
        }

        .status-ok {
            background: #ECFDF5;
            color: #065F46;
            border: 1px solid #A7F3D0;
        }

        .status-ng {
            background: #FFF5F5;
            color: #9B1C1C;
            border: 1px solid #FCA5A5;
        }

        .status-pulse-ok {
            background: #F0FDF4;
            color: #166534;
            border: 1px solid #86EFAC;
        }

        /* Pagination */
        .page-btn {
            min-width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s;
        }

        .page-btn.active {
            background: #1A56DB;
            color: white;
        }

        .page-btn:not(.active):hover {
            background: #EFF6FF;
            color: #1A56DB;
        }

        .page-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex">

    
    <aside class="sidebar bg-white border-r border-slate-200 flex flex-col h-screen overflow-hidden shadow-sm">
        <div class="px-5 py-5 border-b border-slate-100">
            <a href="/" class="flex items-center space-x-2.5 no-underline">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center flex-shrink-0 shadow">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </div>
                <div>
                    <div class="text-sm font-bold text-slate-800 leading-tight">SmartFactory</div>
                    <div class="text-[10px] font-semibold text-blue-600 uppercase tracking-wider leading-tight">Vision
                    </div>
                </div>
            </a>
        </div>
        <nav class="flex-1 py-4 px-3 space-y-0.5 overflow-y-auto">
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest px-3 pb-1.5 pt-1">모니터링</p>
            <a href="/"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                <span>실시간 대시보드</span>
            </a>
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest px-3 pb-1.5 pt-3">기록 / 분석</p>
            <a href="/history"
                class="nav-link active flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-blue-700">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <span>검출 이력</span>
            </a>
            <a href="/history/analytics"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
                <span>통계 분석</span>
            </a>
            <a href="/history/reports"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span>리포트</span>
            </a>
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest px-3 pb-1.5 pt-3">시스템 관리</p>
            <a href="/admin"
                class="nav-link flex items-center space-x-2.5 px-3 py-2 rounded-lg text-sm font-medium no-underline text-slate-600">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                </svg>
                <span>관리자 패널</span>
            </a>
        </nav>
        <div class="px-4 py-4 border-t border-slate-100 flex-shrink-0">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
                    <span class="text-blue-700 font-bold text-xs"
                        th:text="${displayName != null ? displayName.substring(0,1) : 'U'}">A</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-semibold text-slate-700 truncate"
                        th:text="${displayName != null ? displayName : 'User'}">관리자</p>
                    <p class="text-[10px] text-slate-400 font-medium"
                        th:text="${userRole != null ? userRole : 'WORKER'}">ADMIN</p>
                </div>
                <a href="/logout" onclick="return confirm('로그아웃 하시겠습니까?')"
                    class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-md transition-colors"
                    title="로그아웃">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </a>
            </div>
        </div>
    </aside>

    
    <div class="flex-1 flex flex-col h-screen min-w-0 overflow-hidden">

        
        <header
            class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between flex-shrink-0 shadow-sm">
            <div>
                <h1 class="text-sm font-bold text-slate-800">검출 이력 로그</h1>
                <p class="text-[11px] text-slate-400 mt-0.5">AI 비전 검사 기록 · 필터 및 Time-Machine 리플레이</p>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="cleanUpDatabase()"
                    class="px-3 py-1.5 text-[11px] font-semibold text-red-600 border border-red-200 hover:bg-red-50 rounded-lg transition-colors">DB
                    초기화</button>
                <button onclick="fetchAllData()"
                    class="px-3 py-1.5 text-[11px] font-semibold text-blue-600 border border-blue-200 hover:bg-blue-50 rounded-lg transition-colors">새로고침</button>
            </div>
        </header>

        
        <div class="bg-white border-b border-slate-100 px-6 py-3 flex items-center space-x-3 flex-shrink-0">
            <div class="flex items-center space-x-2">
                <label class="text-[11px] font-semibold text-slate-500">카메라</label>
                <select id="filterCamera" onchange="applyFilters()"
                    class="text-xs border border-slate-200 rounded-md px-2 py-1 bg-white text-slate-700 focus:outline-none focus:border-blue-400">
                    <option value="">전체</option>
                    <option value="cam1">CAM-01</option>
                    <option value="cam2">CAM-02</option>
                    <option value="cam3">CAM-03</option>
                    <option value="cam4">CAM-04</option>
                </select>
            </div>
            <div class="flex items-center space-x-2">
                <label class="text-[11px] font-semibold text-slate-500">상태</label>
                <select id="filterStatus" onchange="applyFilters()"
                    class="text-xs border border-slate-200 rounded-md px-2 py-1 bg-white text-slate-700 focus:outline-none focus:border-blue-400">
                    <option value="">전체</option>
                    <option value="OK">정상 (OK)</option>
                    <option value="DEFECT">불량 (DEFECT)</option>
                </select>
            </div>
            <div class="flex items-center space-x-2">
                <label class="text-[11px] font-semibold text-slate-500">검색</label>
                <input id="filterSearch" type="text" oninput="applyFilters()" placeholder="레이블 검색..."
                    class="text-xs border border-slate-200 rounded-md px-2 py-1 bg-white text-slate-700 focus:outline-none focus:border-blue-400 w-36">
            </div>
            <span class="ml-auto text-[11px] text-slate-400">
                총 <span id="totalCount" class="font-bold text-slate-600">0</span>건
            </span>
        </div>

        
        <main class="flex-1 flex min-h-0 overflow-hidden p-4 gap-4">

            
            <div
                class="flex-1 bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col overflow-hidden min-w-0">
                <div class="flex-1 overflow-y-auto min-h-0">
                    <table class="w-full text-left text-sm table-fixed">
                        <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                            <tr>
                                <th
                                    class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-16">
                                    ID</th>
                                <th
                                    class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-40">
                                    시각</th>
                                <th
                                    class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-24">
                                    카메라</th>
                                <th class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider">레이블
                                </th>
                                <th
                                    class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-28">
                                    신뢰도</th>
                                <th
                                    class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-24">
                                    상태</th>
                                <th
                                    class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-wider w-20">
                                    리플레이</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody" class="divide-y divide-slate-100">
                            <tr>
                                <td colspan="7" class="px-4 py-8 text-center text-[12px] text-slate-400">데이터베이스 연결 중...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                
                <div
                    class="border-t border-slate-100 px-4 py-3 flex items-center justify-between flex-shrink-0 bg-slate-50">
                    <span class="text-[11px] text-slate-500">
                        <span id="pageInfo">페이지 1 / 1</span>
                    </span>
                    <div class="flex items-center space-x-1" id="pagination"></div>
                </div>
            </div>

            
            <div id="replayPanel"
                class="w-72 bg-white rounded-xl border border-slate-200 shadow-sm flex-col hidden flex-shrink-0">
                <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                    <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Time-Machine Replay</h3>
                    <button onclick="closeReplay()" class="text-slate-400 hover:text-slate-600">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <div class="p-4 flex-1 overflow-y-auto">
                    
                    <div
                        class="bg-slate-900 rounded-lg aspect-video mb-4 flex items-center justify-center overflow-hidden relative">
                        <img id="replayImage" class="w-full h-full object-contain hidden" alt="Replay Frame" />
                        <div id="replayLoading" class="text-slate-500 text-xs text-center">
                            <svg class="w-8 h-8 mx-auto mb-2 opacity-30" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            항목을 선택하세요
                        </div>
                    </div>
                    
                    <div class="space-y-2 text-xs">
                        <div class="flex justify-between py-1.5 border-b border-slate-100">
                            <span class="text-slate-400 font-medium">로그 ID</span>
                            <span id="replayId" class="font-bold text-slate-700">—</span>
                        </div>
                        <div class="flex justify-between py-1.5 border-b border-slate-100">
                            <span class="text-slate-400 font-medium">시각</span>
                            <span id="replayTime" class="font-mono text-slate-700">—</span>
                        </div>
                        <div class="flex justify-between py-1.5 border-b border-slate-100">
                            <span class="text-slate-400 font-medium">카메라</span>
                            <span id="replayCam" class="text-slate-700">—</span>
                        </div>
                        <div class="flex justify-between py-1.5 border-b border-slate-100">
                            <span class="text-slate-400 font-medium">검출 레이블</span>
                            <span id="replayLabel" class="font-bold text-red-600">—</span>
                        </div>
                        <div class="flex justify-between py-1.5">
                            <span class="text-slate-400 font-medium">신뢰도</span>
                            <span id="replayConf" class="font-bold text-blue-600">—</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        const pageSize = 20;

        async function fetchAllData() {
            try {
                const res = await fetch('/api/history/recent?limit=500');
                if (!res.ok) throw new Error('API Error');
                allData = await res.json();
                document.getElementById('totalCount').textContent = allData.length;
                applyFilters();
            } catch (e) {
                document.getElementById('historyTableBody').innerHTML =
                    '<tr><td colspan="7" class="px-4 py-8 text-center text-red-400 text-xs">데이터 로드 실패. 서버 연결을 확인하세요.</td></tr>';
            }
        }

        function applyFilters() {
            const cam = document.getElementById('filterCamera').value;
            const status = document.getElementById('filterStatus').value;
            const search = document.getElementById('filterSearch').value.toLowerCase();
            filteredData = allData.filter(r => {
                if (cam && r.cameraId !== cam) return false;
                if (status && r.status !== status) return false;
                if (search && !(r.label || '').toLowerCase().includes(search)) return false;
                return true;
            });
            document.getElementById('totalCount').textContent = filteredData.length;
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        function renderTable() {
            const tbody = document.getElementById('historyTableBody');
            const start = (currentPage - 1) * pageSize;
            const pageData = filteredData.slice(start, start + pageSize);
            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-slate-400 text-xs">검색 결과가 없습니다.</td></tr>';
                return;
            }
            tbody.innerHTML = pageData.map(r => {
                const isDefect = r.status === 'DEFECT' || (r.label || '').toLowerCase().includes('defect') || (r.label || '').toLowerCase().includes('ng');
                const statusBadge = isDefect
                    ? '<span class="status-ng text-[10px] font-bold px-2 py-0.5 rounded-full">DEFECT</span>'
                    : '<span class="status-ok text-[10px] font-bold px-2 py-0.5 rounded-full">OK</span>';
                const conf = r.confidence != null ? (r.confidence * (r.confidence <= 1 ? 100 : 1)).toFixed(1) : '—';
                const confColor = isDefect ? 'text-red-600 font-bold' : 'text-slate-700';
                const ts = r.timestamp ? new Date(r.timestamp).toLocaleString('ko-KR') : '—';
                return `<tr class="table-row cursor-pointer" onclick="openReplay(${JSON.stringify(r).replace(/"/g, '&quot;')})">
                    <td class="px-4 py-2.5 text-[11px] font-mono text-slate-400">#${r.id || '—'}</td>
                    <td class="px-4 py-2.5 text-[11px] font-mono text-slate-600">${ts}</td>
                    <td class="px-4 py-2.5 text-[11px] font-semibold text-blue-600">${r.cameraId || '—'}</td>
                    <td class="px-4 py-2.5 text-[11px] text-slate-700 font-medium truncate">${r.label || '—'}</td>
                    <td class="px-4 py-2.5 text-[11px] ${confColor}">${conf}%</td>
                    <td class="px-4 py-2.5">${statusBadge}</td>
                    <td class="px-4 py-2.5">
                        <button class="text-[10px] text-blue-600 hover:text-blue-800 font-semibold hover:underline">▶ 재생</button>
                    </td>
                </tr>`;
            }).join('');
        }

        function renderPagination() {
            const totalPages = Math.max(1, Math.ceil(filteredData.length / pageSize));
            document.getElementById('pageInfo').textContent = `페이지 ${currentPage} / ${totalPages}`;
            const pg = document.getElementById('pagination');
            let html = '';
            html += `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
            const range = [];
            for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) range.push(i);
            range.forEach(p => {
                html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="changePage(${p})">${p}</button>`;
            });
            html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
            pg.innerHTML = html;
        }

        function changePage(p) {
            const totalPages = Math.ceil(filteredData.length / pageSize);
            if (p < 1 || p > totalPages) return;
            currentPage = p;
            renderTable();
            renderPagination();
        }

        function openReplay(r) {
            const panel = document.getElementById('replayPanel');
            panel.classList.remove('hidden');
            panel.classList.add('flex');
            document.getElementById('replayId').textContent = '#' + (r.id || '—');
            document.getElementById('replayTime').textContent = r.timestamp ? new Date(r.timestamp).toLocaleString('ko-KR') : '—';
            document.getElementById('replayCam').textContent = r.cameraId || '—';
            document.getElementById('replayLabel').textContent = r.label || '—';
            document.getElementById('replayConf').textContent = r.confidence != null ? (r.confidence * (r.confidence <= 1 ? 100 : 1)).toFixed(1) + '%' : '—';
            const img = document.getElementById('replayImage');
            const loading = document.getElementById('replayLoading');
            img.classList.add('hidden'); loading.classList.remove('hidden');
            if (r.imagePath) {
                img.src = '/api/history/image/' + r.id;
                img.onload = () => { img.classList.remove('hidden'); loading.classList.add('hidden'); };
                img.onerror = () => { loading.textContent = '이미지를 불러올 수 없습니다.'; };
            }
        }

        function closeReplay() {
            const panel = document.getElementById('replayPanel');
            panel.classList.add('hidden'); panel.classList.remove('flex');
        }

        async function cleanUpDatabase() {
            if (!confirm('모든 검출 이력을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;
            try {
                const res = await fetch('/api/history/cleanup', { method: 'DELETE' });
                if (res.ok) { alert('이력이 초기화되었습니다.'); fetchAllData(); }
                else { const t = await res.text(); alert('초기화 실패: ' + t); }
            } catch (e) { alert('서버 연결 오류: ' + e.message); }
        }

        window.addEventListener('load', fetchAllData);
    </script>
</body>

</html>
