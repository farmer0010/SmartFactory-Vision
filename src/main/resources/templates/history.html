<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SmartFactory History & Stats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
        }

        .neon-border {
            box-shadow: 0 0 10px #22d3ee, 0 0 20px #22d3ee inset;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 10px #22d3ee;
            animation: scan 2s linear infinite;
            z-index: 10;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: 0%;
                opacity: 0;
            }

            5% {
                opacity: 1;
            }

            95% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>

<body class="bg-slate-900 text-cyan-400 h-screen overflow-hidden flex flex-col">
    <!-- Header -->
    <header class="flex justify-between items-center p-4 border-b border-cyan-800 bg-slate-950 shadow-lg z-50">
        <div class="flex items-center space-x-3">
            <svg class="w-8 h-8 text-cyan-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                </path>
            </svg>
            <h1
                class="text-2xl font-bold tracking-widest uppercase text-cyan-300 drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]">
                SmartFactory<span class="text-white">History</span>
            </h1>
        </div>
        <nav class="flex space-x-4">
            <a href="/"
                class="px-3 py-1 bg-slate-800 hover:bg-cyan-900/50 text-slate-400 hover:text-cyan-300 rounded border border-transparent hover:border-cyan-500/50 transition-all text-xs font-bold uppercase tracking-wider">Dashboard</a>
            <a href="/history"
                class="px-3 py-1 bg-cyan-900/30 text-cyan-300 rounded border border-cyan-500/50 shadow-[0_0_10px_rgba(34,211,238,0.2)] text-xs font-bold uppercase tracking-wider">Analysis</a>
        </nav>
        <div class="flex items-center space-x-4">
            <div class="text-[10px] text-slate-500 tracking-widest">SYS.VER.1.0</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 grid grid-cols-12 gap-4 p-4 min-h-0">
        <!-- Chart Area (Left) -->
        <div class="col-span-4 flex flex-col space-y-4 min-h-0">
            <div
                class="bg-slate-800 p-4 rounded-lg border border-cyan-900/50 shadow-[0_0_15px_rgba(0,0,0,0.5)] flex-1 flex flex-col">
                <h3
                    class="text-xs font-bold uppercase border-b border-cyan-900/30 pb-2 mb-4 text-slate-300 tracking-wider">
                    Detection Ratio (Recent 50)</h3>
                <div class="flex-1 relative w-full h-full flex items-center justify-center">
                    <canvas id="ratioChart"></canvas>
                </div>
                <div class="mt-4 flex justify-around text-xs border-t border-cyan-900/30 pt-4">
                    <div class="text-center">
                        <div class="text-slate-400 mb-1">Total Logs</div>
                        <div id="totalCount"
                            class="text-3xl font-bold text-white drop-shadow-[0_0_5px_rgba(255,255,255,0.5)]">0</div>
                    </div>
                    <div class="text-center">
                        <div class="text-slate-400 mb-1">Defect Rate</div>
                        <div id="defectRate"
                            class="text-3xl font-bold text-red-400 drop-shadow-[0_0_5px_rgba(248,113,113,0.5)]">0%</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Table Area (Right) -->
        <div
            class="col-span-8 bg-slate-800 rounded-lg border border-cyan-900/50 shadow-[0_0_15px_rgba(0,0,0,0.5)] flex flex-col min-h-0 overflow-hidden relative group">
            <div class="scan-line opacity-20"></div>
            <div class="p-4 border-b border-cyan-900/50 bg-slate-800/80 z-20 flex justify-between items-center">
                <h3 class="text-xs font-bold uppercase text-slate-300 tracking-wider">Recent Detection Logs</h3>
                <button onclick="fetchHistory()"
                    class="text-[10px] border border-cyan-700 text-cyan-400 hover:bg-cyan-900/50 px-3 py-1.5 rounded transition-colors uppercase font-bold tracking-wider">Refresh
                    Data</button>
            </div>
            <div class="flex-1 overflow-auto z-20">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead
                        class="text-[10px] uppercase bg-slate-900/50 text-slate-400 sticky top-0 backdrop-blur-md z-10 border-b border-cyan-900/50">
                        <tr>
                            <th class="px-4 py-3">ID</th>
                            <th class="px-4 py-3">Timestamp</th>
                            <th class="px-4 py-3">Camera</th>
                            <th class="px-4 py-3">Label</th>
                            <th class="px-4 py-3">Confidence</th>
                            <th class="px-4 py-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody" class="font-mono text-[11px] divide-y divide-slate-700/50">
                        <!-- Data will be populated here -->
                        <tr>
                            <td colspan="6" class="p-4 text-center text-slate-500 italic">Connecting to Database...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let ratioChart = null;

        function initChart() {
            const ctx = document.getElementById('ratioChart').getContext('2d');
            ratioChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['OK', 'DEFECT'],
                    datasets: [{
                        data: [0, 0],
                        backgroundColor: [
                            'rgba(34, 211, 238, 0.8)', // Cyan for OK
                            'rgba(248, 113, 113, 0.8)'  // Red for Defect
                        ],
                        borderColor: [
                            'rgba(34, 211, 238, 1)',
                            'rgba(248, 113, 113, 1)'
                        ],
                        borderWidth: 2,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#94a3b8',
                                padding: 20,
                                font: { family: "'Courier New', Courier, monospace", size: 12, weight: 'bold' }
                            }
                        }
                    }
                }
            });
        }

        function formatTime(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleString('en-US', { hour12: false, month: 'short', day: '2-digit', hour: "2-digit", minute: "2-digit", second: "2-digit" }).replace(',', '');
        }

        async function fetchHistory() {
            try {
                const response = await fetch('/api/history/recent');
                const data = await response.json();

                let okCount = 0;
                let defectCount = 0;

                const tbody = document.getElementById('historyTableBody');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-500 italic">No recent detection logs found.</td></tr>';
                }

                data.forEach(log => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-cyan-900/10 cursor-pointer transition-colors';

                    const isDefect = log.defect;

                    if (isDefect) {
                        defectCount++;
                    } else {
                        okCount++;
                    }

                    const statusHtml = isDefect
                        ? '<span class="px-2 py-0.5 rounded-full text-[10px] uppercase font-bold bg-red-900/50 text-red-400 border border-red-500/30 shadow-[0_0_5px_rgba(248,113,113,0.3)]">DEFECT</span>'
                        : '<span class="px-2 py-0.5 rounded-full text-[10px] uppercase font-bold bg-cyan-900/50 text-cyan-400 border border-cyan-500/30 shadow-[0_0_5px_rgba(34,211,238,0.3)]">OK</span>';

                    const scoreHtml = (log.confidence * 100).toFixed(1) + '%';
                    const timestampHtml = formatTime(log.timestamp);

                    tr.innerHTML = `
                        <td class="px-4 py-3 text-slate-500">#${log.id || ''}</td>
                        <td class="px-4 py-3 text-slate-400">${timestampHtml}</td>
                        <td class="px-4 py-3 text-cyan-200">${log.cameraId || ''}</td>
                        <td class="px-4 py-3 font-bold ${isDefect ? 'text-red-300' : 'text-slate-200'}">${log.label || 'unknown'}</td>
                        <td class="px-4 py-3 text-cyan-400">${scoreHtml}</td>
                        <td class="px-4 py-3">${statusHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });

                // Update stats
                const total = okCount + defectCount;
                if (document.getElementById('totalCount')) {
                    document.getElementById('totalCount').innerText = total;
                }
                if (document.getElementById('defectRate')) {
                    document.getElementById('defectRate').innerText = total > 0 ? ((defectCount / total) * 100).toFixed(1) + '%' : '0%';
                }

                // Update chart
                if (ratioChart) {
                    ratioChart.data.datasets[0].data = [okCount, defectCount];
                    ratioChart.update();
                }

            } catch (error) {
                console.error("Failed to fetch history:", error);
            }
        }

        window.addEventListener('load', () => {
            initChart();
            fetchHistory();
            // Automatically refresh every 5 seconds
            setInterval(fetchHistory, 5000);
        });
    </script>
</body>

</html>
