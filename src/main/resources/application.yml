server:
  port: ${PORT:9090}
  error:
    include-message: always
    include-exception: true
    include-stacktrace: always
spring:
  application:
    name: SmartFactory-Vision
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driverClassName: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  ai:
    work-dir: ${APP_AI_WORK_DIR}
    model-path: ${APP_AI_MODEL_PATH}
  opcua:
    endpoint-url: ${APP_OPCUA_ENDPOINT:opc.tcp://localhost:4840}
    nodes:
      estop: "ns=2;s=Machine.EStop"
      status: "ns=2;s=Machine.Status"
      reject-kicker: "ns=2;s=Machine.RejectKicker"

logging:
  file:
    name: logs/app.log
  level:
    root: INFO
    com.smartfactory: DEBUG
    com.jpyrust: DEBUG
